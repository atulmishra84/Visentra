services:
  postgres:
    image: postgres:15-alpine
    container_name: agentRadar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentradar
      POSTGRES_USER: agentradar
      POSTGRES_PASSWORD: AgentRadarProd2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentradar"]
      interval: 5s
      retries: 10
    networks: [agentRadar]

  redis:
    image: redis:7-alpine
    container_name: agentRadar-redis
    restart: unless-stopped
    networks: [agentRadar]

  api:
    image: acragentradarprod.azurecr.io/agentradar-api:latest
    container_name: agentRadar-api
    restart: unless-stopped
    expose: ["4000"]
    volumes:
      - ./server.js:/app/server.js
      - ./src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_USER: agentradar
      POSTGRES_DB: agentradar
      DB_PASSWORD: AgentRadarProd2026
      POSTGRES_PASSWORD: AgentRadarProd2026
      POSTGRES_SSL: "false"
      DATABASE_URL: postgresql://agentradar:AgentRadarProd2026@postgres:5432/agentradar?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
      REDIS_PASSWORD: ""
      JWT_SECRET: ee847d5720ce353437b5f6f675ae3f6e6eaa403cc69eb30047416184b41ea504a5329e648707d4fad53ddaf5d010b5eee2556696ddae82865aee80d35f16ceb7
      TENANT_ID: 7a570fd1-8a60-4115-9e1b-68f9102f4eab
      ALLOWED_ORIGINS: "https://20.228.158.234,https://agentradar.idenaccess.com"
      AZURE_SSO_CLIENT_ID: "69d24852-7933-4bd5-83db-c71112c8759d"
      AZURE_SSO_CLIENT_SECRET: "egm8Q~WAzwKWw2GCoUwXdGUsF~sDyFrJK0JELbGy"
      AZURE_TENANT_ID: "7a570fd1-8a60-4115-9e1b-68f9102f4eab"
      APP_URL: "https://20.228.158.234"
      LOG_ANALYTICS_WORKSPACE_ID: "da801d2c-7011-4955-8d7c-2c6f095ac4e2"
      LOG_ANALYTICS_KEY: "bVqFosND+vH9f2LtHh08VbYAtPg0drfPb2algvj9eqd/ZH/etciZBRlKmZM9W5lfGZZozzm8K9QZ9Pqi0/pZfg=="
    depends_on:
      postgres:
        condition: service_healthy
    networks: [agentRadar]

  frontend:
    image: acragentradarprod.azurecr.io/agentradar-frontend:latest
    container_name: agentRadar-frontend
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health || curl -fs http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on: [api]
    networks: [agentRadar]

volumes:
  pgdata:

networks:
  agentRadar:
    driver: bridge
