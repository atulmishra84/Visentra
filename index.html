<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentRadar — AI Governance</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel2: #182338;
      --border: #243049;
      --text: #e8eef9;
      --muted: #93a0b8;
      --accent: #3d8bfd;
      --accent2: #1f6feb;
      --danger: #f85149;
      --warn: #d29922;
      --ok: #3fb950;
      --high: #f85149;
      --med: #d29922;
      --low: #3fb950;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2744, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); }
    .hidden { display: none !important; }
    #login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: min(420px, 100%);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .02em;
      margin: 0 0 4px;
    }
    .tagline { color: var(--muted); margin: 0 0 20px; font-size: .92rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 10px 12px;
      width: 100%;
    }
    button {
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 16px;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .error { color: var(--danger); font-size: .9rem; margin-top: 10px; }
    .ok { color: var(--ok); font-size: .9rem; margin-top: 10px; }

    #app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    nav {
      background: rgba(10,16,28,.92);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    nav .brand { font-size: 1.1rem; padding: 0 8px 12px; }
    nav button {
      margin: 0;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-weight: 500;
    }
    nav button.active, nav button:hover {
      background: var(--panel2);
      border-color: var(--border);
      color: var(--text);
    }
    nav .user {
      margin-top: auto;
      padding: 12px 8px 0;
      border-top: 1px solid var(--border);
      font-size: .85rem;
      color: var(--muted);
    }
    main { padding: 24px 28px 48px; }
    h1 { margin: 0 0 6px; font-size: 1.45rem; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .toolbar button { width: auto; margin: 0; padding: 8px 14px; }
    .toolbar input, .toolbar select { width: auto; min-width: 160px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; background: var(--panel2); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.high { background: rgba(248,81,73,.2); color: var(--high); }
    .badge.medium { background: rgba(210,153,34,.2); color: var(--med); }
    .badge.low { background: rgba(63,185,80,.2); color: var(--low); }
    .badge.fail { background: rgba(248,81,73,.2); color: var(--high); }
    .badge.cleared, .badge.pass { background: rgba(63,185,80,.2); color: var(--ok); }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .stat .n { font-size: 1.6rem; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: .8rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .drawer {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      font-size: .85rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    @media (max-width: 860px) {
      #app-shell { grid-template-columns: 1fr; }
      nav { flex-direction: row; flex-wrap: wrap; }
      nav .user { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="login-view">
    <div class="card">
      <p class="brand">AgentRadar</p>
      <p class="tagline">Discover. Govern. Secure. Every AI agent, everywhere.</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="username" />
        <label>Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
        <div id="mfa-fields" class="hidden">
          <label>MFA code</label>
          <input type="text" id="login-mfa" inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <nav>
      <div class="brand">AgentRadar</div>
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="inventory">1 · Discovery</button>
      <button data-view="phi">2 · PHI</button>
      <button data-view="risk">3 · Risk</button>
      <button data-view="users" data-roles="platform_admin,ciso">4 · Users / RBAC</button>
      <button data-view="mfa" data-roles="platform_admin,ciso">5 · MFA</button>
      <button data-view="audit">6 · Audit</button>
      <button data-view="siem">7 · SIEM</button>
      <button data-view="tenants" data-roles="platform_admin">8 · Tenants</button>
      <button data-view="security">9 · BYOC Security</button>
      <button data-view="reports">10 · Reports</button>
      <div class="user">
        <div id="user-label"></div>
        <button class="secondary" id="logout-btn" style="margin-top:10px">Sign out</button>
      </div>
    </nav>
    <main>
      <section id="view-dashboard" class="view"></section>
      <section id="view-inventory" class="view hidden"></section>
      <section id="view-phi" class="view hidden"></section>
      <section id="view-risk" class="view hidden"></section>
      <section id="view-users" class="view hidden"></section>
      <section id="view-mfa" class="view hidden"></section>
      <section id="view-audit" class="view hidden"></section>
      <section id="view-siem" class="view hidden"></section>
      <section id="view-tenants" class="view hidden"></section>
      <section id="view-security" class="view hidden"></section>
      <section id="view-reports" class="view hidden"></section>
    </main>
  </div>

  <script>
    let csrfToken = '';
    let currentUser = null;

    async function ensureCsrf() {
      const r = await fetch('/api/csrf', { credentials: 'include' });
      const j = await r.json();
      csrfToken = j.csrfToken;
    }

    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      if (opts.method && !['GET', 'HEAD'].includes(opts.method)) {
        headers['X-CSRF-Token'] = csrfToken;
      }
      const res = await fetch(path, { credentials: 'include', ...opts, headers });
      if (res.status === 401) {
        showLogin();
        throw new Error('Unauthorized');
      }
      const ct = res.headers.get('content-type') || '';
      const data = ct.includes('application/json') ? await res.json() : await res.text();
      if (!res.ok) throw new Error((data && data.error) || res.statusText);
      return data;
    }

    function showLogin() {
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('app-shell').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      document.getElementById('user-label').textContent =
        `${currentUser.name} · ${currentUser.role} · ${currentUser.email}`;
      document.querySelectorAll('nav button[data-roles]').forEach((btn) => {
        const roles = btn.dataset.roles.split(',');
        btn.classList.toggle('hidden', !roles.includes(currentUser.role));
      });
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.classList.add('hidden');
      try {
        await ensureCsrf();
        const body = {
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value,
        };
        const mfa = document.getElementById('login-mfa').value;
        if (mfa) body.mfaCode = mfa;
        const data = await api('/api/auth/login', { method: 'POST', body });
        if (data.mfaRequired) {
          document.getElementById('mfa-fields').classList.remove('hidden');
          err.textContent = 'Enter your authenticator code';
          err.classList.remove('hidden');
          return;
        }
        currentUser = data.user;
        await ensureCsrf();
        showApp();
        navigate('dashboard');
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch {}
      currentUser = null;
      showLogin();
    });

    document.querySelectorAll('nav button[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => navigate(btn.dataset.view));
    });

    function navigate(view) {
      document.querySelectorAll('nav button[data-view]').forEach((b) => {
        b.classList.toggle('active', b.dataset.view === view);
      });
      document.querySelectorAll('main .view').forEach((s) => s.classList.add('hidden'));
      const el = document.getElementById('view-' + view);
      el.classList.remove('hidden');
      const loaders = {
        dashboard: renderDashboard,
        inventory: renderInventory,
        phi: renderPhi,
        risk: renderRisk,
        users: renderUsers,
        mfa: renderMfa,
        audit: renderAudit,
        siem: renderSiem,
        tenants: renderTenants,
        security: renderSecurity,
        reports: renderReports,
      };
      (loaders[view] || (() => {}))(el);
    }

    function badge(level) {
      return `<span class="badge ${level}">${level}</span>`;
    }

    async function renderDashboard(el) {
      el.innerHTML = `<h1>Governance overview</h1><p class="sub">DISCOVER → ASSESS → GOVERN → PROVE</p><p>Loading…</p>`;
      try {
        const [agents, risk] = await Promise.all([
          api('/api/agents'),
          api('/api/risk/register'),
        ]);
        const phi = agents.agents.filter((a) => a.phi_flagged).length;
        el.innerHTML = `
          <h1>Governance overview</h1>
          <p class="sub">Live posture for tenant ${currentUser.tenantId}</p>
          <div class="stats">
            <div class="stat"><div class="n">${agents.agents.length}</div><div class="l">AI agents</div></div>
            <div class="stat"><div class="n">${risk.summary.high}</div><div class="l">High risk</div></div>
            <div class="stat"><div class="n">${phi}</div><div class="l">PHI flagged</div></div>
            <div class="stat"><div class="n">${risk.summary.medium}</div><div class="l">Medium risk</div></div>
          </div>
          <div class="panel">Run discovery from module 1 to refresh inventory. Risk and PHI update automatically on each scan.</div>
        `;
      } catch (ex) {
        el.innerHTML = `<h1>Dashboard</h1><p class="error">${ex.message}</p>`;
      }
    }

    async function renderInventory(el) {
      el.innerHTML = `<h1>Module 1 — Continuous AI Agent Discovery</h1><p class="sub">Living registry of AI-related Azure resources</p>`;
      el.innerHTML += `<div class="toolbar"><button id="run-discovery">Run discovery</button><span id="disc-msg"></span></div><div id="inv-table">Loading…</div>`;
      const load = async () => {
        const data = await api('/api/agents');
        document.getElementById('inv-table').innerHTML = `
          <table>
            <thead><tr><th>Name</th><th>Type</th><th>Region</th><th>Risk</th><th>PHI</th><th>Last seen</th></tr></thead>
            <tbody>
              ${data.agents.map((a) => `
                <tr>
                  <td>${esc(a.name)}</td>
                  <td>${esc(a.resource_type)}</td>
                  <td>${esc(a.region || '—')}</td>
                  <td>${badge(a.risk_level)} ${a.risk_score}</td>
                  <td>${a.phi_flagged ? badge('fail') : '—'}</td>
                  <td>${fmt(a.last_seen)}</td>
                </tr>`).join('') || '<tr><td colspan="6">No agents yet — run discovery.</td></tr>'}
            </tbody>
          </table>`;
      };
      document.getElementById('run-discovery').onclick = async () => {
        const msg = document.getElementById('disc-msg');
        msg.textContent = 'Scanning…';
        try {
          const r = await api('/api/discovery/run', { method: 'POST', body: {} });
          msg.textContent = `Found ${r.agents_found} resources${r.demo ? ' (demo mode)' : ''}`;
          await load();
        } catch (ex) { msg.textContent = ex.message; }
      };
      try { await load(); } catch (ex) {
        document.getElementById('inv-table').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    async function renderPhi(el) {
      el.innerHTML = `<h1>Module 2 — PHI / Sensitive Data Detection</h1>
        <p class="sub">Keyword · resource type · protocol vectors. Flagged agents default to HIPAA fail.</p>
        <div id="phi-table">Loading…</div>`;
      try {
        const data = await api('/api/phi');
        document.getElementById('phi-table').innerHTML = `
          <table>
            <thead><tr><th>Agent</th><th>Vectors</th><th>HIPAA</th><th>Action</th></tr></thead>
            <tbody>
              ${data.agents.map((a) => `
                <tr>
                  <td>${esc(a.name)}<div class="drawer">${esc(a.resource_type)}</div></td>
                  <td><div class="drawer">${esc(JSON.stringify(a.phi_vectors, null, 2))}</div></td>
                  <td>${badge(a.hipaa_status === 'cleared' ? 'cleared' : 'fail')}</td>
                  <td>${a.hipaa_status === 'cleared' ? 'Cleared' :
                    `<button data-clear="${a.id}" class="secondary" style="width:auto;margin:0">Clear</button>`}</td>
                </tr>`).join('') || '<tr><td colspan="4">No PHI-flagged agents.</td></tr>'}
            </tbody>
          </table>`;
        document.querySelectorAll('[data-clear]').forEach((btn) => {
          btn.onclick = async () => {
            const reason = prompt('Clearance reason (required for audit):');
            if (!reason) return;
            await api(`/api/phi/${btn.dataset.clear}/clear`, { method: 'POST', body: { reason } });
            renderPhi(el);
          };
        });
      } catch (ex) {
        document.getElementById('phi-table').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    async function renderRisk(el) {
      el.innerHTML = `<h1>Module 3 — Risk & Compliance Scoring</h1>
        <p class="sub">Composite scores mapped to HIPAA, SOC 2, ISO 27001, GDPR, NIST AI RMF, EU AI Act</p>
        <div id="risk-body">Loading…</div>`;
      try {
        const data = await api('/api/risk/register');
        document.getElementById('risk-body').innerHTML = `
          <div class="stats">
            <div class="stat"><div class="n">${data.summary.high}</div><div class="l">High</div></div>
            <div class="stat"><div class="n">${data.summary.medium}</div><div class="l">Medium</div></div>
            <div class="stat"><div class="n">${data.summary.low}</div><div class="l">Low</div></div>
          </div>
          <table>
            <thead><tr><th>Agent</th><th>Score</th><th>Level</th><th>Factors</th></tr></thead>
            <tbody>
              ${data.agents.map((a) => `
                <tr>
                  <td>${esc(a.name)}</td>
                  <td>${a.risk_score}</td>
                  <td>${badge(a.risk_level)}</td>
                  <td><details><summary>Why</summary><div class="drawer">${esc(JSON.stringify(a.risk_factors, null, 2))}

Frameworks:
${esc(JSON.stringify(a.framework_scores, null, 2))}</div></details></td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (ex) {
        document.getElementById('risk-body').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    async function renderUsers(el) {
      el.innerHTML = `<h1>Module 4 — RBAC</h1>
        <p class="sub">Platform Admin · CISO · Analyst · Auditor</p>
        <div class="panel">
          <strong>Provision user</strong>
          <div class="toolbar" style="margin-top:10px">
            <input id="u-email" placeholder="email" />
            <input id="u-name" placeholder="name" />
            <select id="u-role">
              <option value="analyst">analyst</option>
              <option value="auditor">auditor</option>
              <option value="ciso">ciso</option>
              <option value="platform_admin">platform_admin</option>
            </select>
            <input id="u-pass" type="password" placeholder="password (12+)" />
            <button id="u-create">Create</button>
          </div>
          <p id="u-msg"></p>
        </div>
        <div id="users-table">Loading…</div>`;
      const load = async () => {
        const data = await api('/api/users');
        document.getElementById('users-table').innerHTML = `
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>MFA</th><th>Last login</th></tr></thead>
            <tbody>
              ${data.users.map((u) => `
                <tr>
                  <td>${esc(u.name)}</td>
                  <td>${esc(u.email)}</td>
                  <td>${esc(u.role)}</td>
                  <td>${u.mfa_enabled ? 'Yes' : 'No'}</td>
                  <td>${fmt(u.last_login)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      };
      document.getElementById('u-create').onclick = async () => {
        const msg = document.getElementById('u-msg');
        try {
          await api('/api/users', {
            method: 'POST',
            body: {
              email: document.getElementById('u-email').value,
              name: document.getElementById('u-name').value,
              role: document.getElementById('u-role').value,
              password: document.getElementById('u-pass').value,
            },
          });
          msg.className = 'ok';
          msg.textContent = 'User provisioned';
          await load();
        } catch (ex) {
          msg.className = 'error';
          msg.textContent = ex.message;
        }
      };
      try { await load(); } catch (ex) {
        document.getElementById('users-table').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    async function renderMfa(el) {
      el.innerHTML = `<h1>Module 5 — Multi-Factor Authentication</h1>
        <p class="sub">TOTP enforced for Platform Admin and CISO</p>
        <div class="panel">
          <p>Status: <strong>${currentUser.mfaEnabled ? 'Enabled' : 'Not enrolled'}</strong></p>
          <button id="mfa-setup" style="width:auto">Start enrollment</button>
          <div id="mfa-enroll" class="hidden" style="margin-top:16px">
            <img id="mfa-qr" alt="MFA QR" style="background:#fff;padding:8px;border-radius:8px;max-width:200px" />
            <label>Confirm code</label>
            <input id="mfa-code" style="max-width:200px" />
            <button id="mfa-confirm" style="width:auto">Confirm</button>
            <p id="mfa-msg"></p>
          </div>
        </div>`;
      document.getElementById('mfa-setup').onclick = async () => {
        const data = await api('/api/mfa/setup', { method: 'POST', body: {} });
        document.getElementById('mfa-enroll').classList.remove('hidden');
        document.getElementById('mfa-qr').src = data.qrDataUrl;
      };
      document.getElementById('mfa-confirm').onclick = async () => {
        try {
          await api('/api/mfa/confirm', {
            method: 'POST',
            body: { code: document.getElementById('mfa-code').value },
          });
          document.getElementById('mfa-msg').className = 'ok';
          document.getElementById('mfa-msg').textContent = 'MFA enabled';
          currentUser.mfaEnabled = true;
        } catch (ex) {
          document.getElementById('mfa-msg').className = 'error';
          document.getElementById('mfa-msg').textContent = ex.message;
        }
      };
    }

    async function renderAudit(el) {
      el.innerHTML = `<h1>Module 6 — Audit Logging & Evidence</h1>
        <p class="sub">Immutable PostgreSQL trail with export</p>
        <div class="toolbar">
          <button id="audit-json">Export JSON</button>
          <button id="audit-csv" class="secondary">Export CSV</button>
        </div>
        <div id="audit-table">Loading…</div>`;
      document.getElementById('audit-json').onclick = () => {
        window.open('/api/audit/export?format=json', '_blank');
      };
      document.getElementById('audit-csv').onclick = () => {
        window.open('/api/audit/export?format=csv', '_blank');
      };
      try {
        const data = await api('/api/audit?limit=100');
        document.getElementById('audit-table').innerHTML = `
          <table>
            <thead><tr><th>Time</th><th>Action</th><th>Actor</th><th>Detail</th></tr></thead>
            <tbody>
              ${data.events.map((e) => `
                <tr>
                  <td>${fmt(e.created_at)}</td>
                  <td>${esc(e.action)}</td>
                  <td>${esc(e.actor_email || '—')}</td>
                  <td><div class="drawer">${esc(JSON.stringify(e.detail))}</div></td>
                </tr>`).join('') || '<tr><td colspan="4">No events</td></tr>'}
            </tbody>
          </table>`;
      } catch (ex) {
        document.getElementById('audit-table').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    function renderSiem(el) {
      el.innerHTML = `
        <h1>Module 7 — SIEM & Observability</h1>
        <p class="sub">Azure Monitor / Log Analytics forwarding (fail-soft)</p>
        <div class="panel">
          <p>Configure <code>LOG_ANALYTICS_WORKSPACE_ID</code> and <code>LOG_ANALYTICS_KEY</code>. Audit events stream to custom log <strong>AgentRadarAudit_CL</strong>.</p>
          <pre class="drawer">AgentRadarAudit_CL
| where TimeGenerated > ago(90d)
| where action_s in ("login","agent_flagged","compliance_export","user_provisioned","discovery_scan")
| order by TimeGenerated desc</pre>
        </div>`;
    }

    async function renderTenants(el) {
      el.innerHTML = `<h1>Module 8 — Multi-Tenant Architecture</h1>
        <p class="sub">Logical isolation inside BYOC deploy</p>
        <div class="toolbar">
          <input id="t-name" placeholder="Tenant name" />
          <input id="t-slug" placeholder="slug (optional)" />
          <button id="t-create">Create tenant</button>
        </div>
        <div id="tenants-table">Loading…</div>`;
      const load = async () => {
        const data = await api('/api/tenants');
        document.getElementById('tenants-table').innerHTML = `
          <table>
            <thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Created</th></tr></thead>
            <tbody>
              ${data.tenants.map((t) => `
                <tr>
                  <td>${esc(t.name)}</td>
                  <td>${esc(t.slug)}</td>
                  <td>${esc(t.status)}</td>
                  <td>${fmt(t.created_at)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      };
      document.getElementById('t-create').onclick = async () => {
        await api('/api/tenants', {
          method: 'POST',
          body: {
            name: document.getElementById('t-name').value,
            slug: document.getElementById('t-slug').value || undefined,
          },
        });
        await load();
      };
      try { await load(); } catch (ex) {
        document.getElementById('tenants-table').innerHTML = `<p class="error">${ex.message}</p>`;
      }
    }

    function renderSecurity(el) {
      el.innerHTML = `
        <h1>Module 9 — BYOC Security Architecture</h1>
        <p class="sub">Data stays in your Azure tenant</p>
        <div class="panel">
          <ul>
            <li>TLS via nginx (Let's Encrypt)</li>
            <li>httpOnly, Secure, SameSite=strict JWT cookies</li>
            <li>CSP, HSTS, X-Frame-Options</li>
            <li>Redis-backed auth rate limiting</li>
            <li>CSRF on state-mutating routes</li>
            <li>bcryptjs password hashing</li>
            <li>AES-256-GCM for integration credentials</li>
            <li>API exposed only via nginx reverse proxy</li>
          </ul>
        </div>`;
    }

    async function renderReports(el) {
      el.innerHTML = `<h1>Module 10 — Compliance Reporting</h1>
        <p class="sub">Board-ready inventory, risk, PHI, and audit evidence</p>
        <div class="toolbar">
          <button id="rep-load">Generate report</button>
          <button id="rep-csv" class="secondary">Download CSV</button>
        </div>
        <div id="rep-body"></div>`;
      document.getElementById('rep-csv').onclick = () => {
        window.open('/api/reports/compliance?format=csv&days=90', '_blank');
      };
      document.getElementById('rep-load').onclick = async () => {
        const data = await api('/api/reports/compliance?days=90');
        const r = data.report;
        document.getElementById('rep-body').innerHTML = `
          <div class="stats">
            <div class="stat"><div class="n">${r.inventory.total_agents}</div><div class="l">Agents</div></div>
            <div class="stat"><div class="n">${r.inventory.by_risk.high}</div><div class="l">High risk</div></div>
            <div class="stat"><div class="n">${r.inventory.phi_under_remediation}</div><div class="l">PHI remediating</div></div>
            <div class="stat"><div class="n">${r.governance_actions.length}</div><div class="l">Actions (period)</div></div>
          </div>
          <div class="panel"><strong>Framework posture</strong>
            <pre class="drawer">${esc(JSON.stringify(r.compliance_posture, null, 2))}</pre>
          </div>
          <div class="panel"><strong>Users</strong>
            <pre class="drawer">${esc(JSON.stringify(r.users, null, 2))}</pre>
          </div>`;
      };
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function fmt(v) {
      if (!v) return '—';
      try { return new Date(v).toLocaleString(); } catch { return String(v); }
    }

    (async function init() {
      try {
        await ensureCsrf();
        const me = await api('/api/auth/me');
        currentUser = me.user;
        showApp();
        navigate('dashboard');
      } catch {
        showLogin();
      }
    })();
  </script>
</body>
</html>
