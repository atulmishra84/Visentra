version: '3.8'

# AgentRadar Production Docker Compose
# Use this for single-VM deployment (non-AKS)
# For AKS use k8s/ manifests instead

services:

  postgres:
    image: postgres:15-alpine
    container_name: agentRadar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agentradar
      POSTGRES_USER:     agentradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U agentradar"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: agentRadar-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - internal
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: final
    image: acragentradarprod.azurecr.io/agentradar-api:${TAG:-latest}
    container_name: agentRadar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      PORT:                 4000
      DATABASE_URL:         postgresql://agentradar:${POSTGRES_PASSWORD}@postgres:5432/agentradar
      REDIS_URL:            redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:           ${JWT_SECRET}
      JWT_EXPIRES_IN:       30m
      APP_URL:              ${APP_URL:-https://agentradar.idenaccess.com}
      AZURE_TENANT_ID:      ${AZURE_TENANT_ID}
      AZURE_SSO_CLIENT_ID:  ${AZURE_SSO_CLIENT_ID}
      AZURE_SSO_CLIENT_SECRET: ${AZURE_SSO_CLIENT_SECRET}
    networks:
      - internal
    expose:
      - "4000"
    healthcheck:
      test: ["CMD","curl","-fs","http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: acragentradarprod.azurecr.io/agentradar-frontend:${TAG:-latest}
    container_name: agentRadar-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD","curl","-fs","http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  pgdata:
    driver: local
