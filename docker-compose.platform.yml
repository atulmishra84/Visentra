version: "3.9"

# ═══════════════════════════════════════════════════════════════════
# docker-compose.platform.yml
#
# Deploys the platform/ monorepo ALONGSIDE the already-running
# root (docker-compose.yml) and deploy (docker-compose.deploy.yml) stacks.
#
# It REUSES the postgres and redis already defined in docker-compose.yml.
# The only new infrastructure it adds is Neo4j (graph DB).
#
# ── USAGE ──────────────────────────────────────────────────────────
# Always run ALL THREE files together under the SAME project name
# so every service shares the single "visentra_internal" network:
#
#   docker compose -p visentra \
#     -f docker-compose.yml \
#     -f docker-compose.deploy.yml \
#     -f docker-compose.platform.yml \
#     up -d --build
#
# To bring up ONLY root + platform (no deploy/ stack):
#   docker compose -p visentra \
#     -f docker-compose.yml \
#     -f docker-compose.platform.yml \
#     up -d --build
#
# ── PORT MAP ───────────────────────────────────────────────────────
#   :80    → root nginx      → root api (3000)           [root stack]
#   :8080  → deploy-frontend → deploy-api (4000)         [deploy stack]
#   :9000  → platform-web   → platform-api (8080)        [platform stack]
#   :7474  → neo4j browser  (CLOSE THIS IN PROD)
# ═══════════════════════════════════════════════════════════════════

services:

  # ── Neo4j Graph Database ────────────────────────────────────────
  # Only used by the platform stack (API + relationship worker).
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      # Also expose as plain env var so the healthcheck shell can read it
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4jdata:/data
    expose:
      - "7687"
      - "7474"
    # Remove the line below once confirmed working — do NOT expose 7474 in production
    ports:
      - "7474:7474"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      # HTTP check — no credentials needed, works regardless of what NEO4J_PASSWORD is
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  # ── Platform API ────────────────────────────────────────────────
  # ESM Node.js (port 8080 internal). Runs migrations on startup.
  # Requires: POSTGRES_URL, JWT_SECRET, ENCRYPTION_KEY, CORS_ORIGIN.
  platform-api:
    build:
      context: ./platform/apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Shared Postgres — same instance as root/deploy stacks
      POSTGRES_URL: postgres://${POSTGRES_USER:-agentradar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-agentradar}
      # Shared Redis
      REDIS_URL: redis://redis:6379
      # Neo4j (platform-only)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      # Auth — must be strong in production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      # CORS — exact URL of platform-web as seen by the browser
      CORS_ORIGIN: ${PLATFORM_WEB_URL:?PLATFORM_WEB_URL must be set (e.g. http://your-ec2-ip:9000)}
      # Admin bootstrap
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set in .env}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Enterprise}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-enterprise}
      # Discovery
      DISCOVERY_AI_ONLY: "true"
      DISCOVERY_DEMO_SEED: "false"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ── Platform Web (React/Vite) ───────────────────────────────────
  # Built at image-build time. nginx proxies /api/ → platform-api:8080.
  # VITE_API_URL="" means the frontend uses same-origin /api proxy (recommended).
  platform-web:
    build:
      context: ./platform/apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    environment:
      # Injected at runtime into nginx.conf.template via Docker envsubst
      API_UPSTREAM: "platform-api:8080"
    ports:
      - "9000:80"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Discovery Worker ────────────────────────────────────────────
  # Thin cron: logs into platform-api over HTTP every 5 min and
  # triggers a discovery job. Actual collection runs inside platform-api.
  platform-discovery:
    build:
      context: ./platform/apps/discovery
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: "http://platform-api:8080"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set in .env}
      DISCOVERY_INTERVAL_MS: "300000"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      platform-api:
        condition: service_healthy

  # ── Relationship Engine Worker ──────────────────────────────────
  # Runs Neo4j edge-decay queries every hour.
  # Idles harmlessly if NEO4J_URI is unset.
  platform-relationship:
    build:
      context: ./platform/apps/relationship
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      RELATIONSHIP_DECAY_INTERVAL_MS: "3600000"
      RELATIONSHIP_DECAY_DAYS: "30"
      RELATIONSHIP_DECAY_MIN_CONFIDENCE: "0.4"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4jdata:

# The "internal" network is defined by docker-compose.yml.
# Docker Compose merges it — no conflict, all services share one network.
networks:
  internal:
    driver: bridge
