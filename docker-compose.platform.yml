version: "3.9"

# ─────────────────────────────────────────────────────────────────
# docker-compose.platform.yml
#
# Runs the four services from platform/apps/ alongside the already-
# running root + deploy stacks.
#
# Services added:
#   platform-api          (ESM Node.js API,  port 8080, internal)
#   platform-web          (React/Vite UI,    port 9000, public)
#   platform-discovery    (discovery worker, no public port)
#   platform-relationship (Neo4j edge decay, no public port)
#   neo4j                 (graph DB,         port 7474/7687)
#
# The neo4j service is NEW — the root stack only uses Postgres+Redis.
# Postgres and Redis are SHARED from the root stack via the same
# Docker project network (visentra_internal).
#
# HOW TO RUN (add to the existing merged project):
#
#   docker compose -p visentra \
#     -f docker-compose.yml \
#     -f docker-compose.deploy.yml \
#     -f docker-compose.platform.yml \
#     up -d --build
#
# To bring up ONLY the platform stack (still needs postgres+redis):
#   docker compose -p visentra \
#     -f docker-compose.yml \
#     -f docker-compose.platform.yml \
#     up -d --build
# ─────────────────────────────────────────────────────────────────

services:

  # ── Neo4j Graph Database (NEW — only needed by platform) ───────
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agentradar}
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4jdata:/data
    expose:
      - "7687"   # Bolt (internal)
      - "7474"   # HTTP browser (internal)
    ports:
      - "7474:7474"   # Expose browser UI for debugging — remove in prod
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-agentradar} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  # ── Platform API (platform/apps/api) ───────────────────────────
  platform-api:
    build:
      context: ./platform/apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Connection strings — uses same postgres+redis as root stack
      POSTGRES_URL: postgres://${POSTGRES_USER:-agentradar}:${POSTGRES_PASSWORD:-agentradar}@postgres:5432/${POSTGRES_DB:-agentradar}
      REDIS_URL: redis://redis:6379
      # Neo4j — optional; enables graph features
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agentradar}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # CORS: must match the web service public URL
      CORS_ORIGIN: "http://${EC2_HOST:-localhost}:9000"
      # Admin bootstrap
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Enterprise}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-enterprise}
      # Discovery
      DISCOVERY_AI_ONLY: "true"
      DISCOVERY_DEMO_SEED: "false"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ── Platform Web (platform/apps/web) ──────────────────────────
  # Vite/React app compiled at build time, served via nginx.
  # nginx.conf.template uses API_UPSTREAM env var (set via Docker nginx envsubst).
  platform-web:
    build:
      context: ./platform/apps/web
      dockerfile: Dockerfile
      args:
        # Bake the API URL into the Vite bundle at build time.
        # If your EC2 has a domain, replace with https://yourdomain.com
        VITE_API_URL: ""   # empty = use same-origin /api proxy via nginx
    environment:
      # nginx.conf.template uses this to know where to proxy /api/
      API_UPSTREAM: "platform-api:8080"
    ports:
      - "9000:80"    # Access via http://<EC2-IP>:9000
    depends_on:
      - platform-api
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Discovery Worker (platform/apps/discovery) ────────────────
  # A sidecar that periodically calls the platform-api to trigger
  # discovery jobs. It does NOT collect data itself — it delegates
  # to the API's pipeline.
  platform-discovery:
    build:
      context: ./platform/apps/discovery
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: "http://platform-api:8080"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      DISCOVERY_INTERVAL_MS: "300000"   # 5 minutes
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      platform-api:
        condition: service_healthy

  # ── Relationship Engine Worker (platform/apps/relationship) ────
  # Runs Neo4j edge-decay queries on a schedule.
  # If NEO4J_URI is not set, it idles harmlessly.
  platform-relationship:
    build:
      context: ./platform/apps/relationship
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agentradar}
      RELATIONSHIP_DECAY_INTERVAL_MS: "3600000"   # 1 hour
      RELATIONSHIP_DECAY_DAYS: "30"
      RELATIONSHIP_DECAY_MIN_CONFIDENCE: "0.4"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4jdata:

networks:
  internal:
    driver: bridge
