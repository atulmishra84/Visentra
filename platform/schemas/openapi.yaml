openapi: 3.0.3
info:
  title: AgentRadar Discovery & Visibility API
  version: 1.0.0
  description: |
    Enterprise AI Agent Discovery & Visibility Platform API (MVP).
    Conventions: tenant-scoped JWT bearer auth, roles platform_admin|operator|viewer.
    See docs/blueprint/11-apis.md and 24-api-specifications.md.
servers:
  - url: http://localhost:8080
    description: Local MVP
  - url: https://api.example.com
    description: Production
tags:
  - name: auth
  - name: agents
  - name: assets
  - name: graph
  - name: search
  - name: discovery
  - name: dashboards
  - name: usage
  - name: connectors
  - name: export
  - name: coverage
  - name: audit
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness (postgres + neo4j)
      responses:
        '200':
          description: Ready
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login (local JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
  /api/auth/entra/start:
    get:
      tags: [auth]
      summary: Start Entra OIDC login (when configured)
      responses:
        '302':
          description: Redirect to IdP
  /api/agents:
    get:
      tags: [agents]
      summary: List agents (faceted)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/model'
        - $ref: '#/components/parameters/framework'
        - $ref: '#/components/parameters/cloud'
        - $ref: '#/components/parameters/category'
        - in: query
          name: ide
          schema: { type: string }
        - in: query
          name: evidenceClass
          schema: { type: string }
        - in: query
          name: agentStatus
          schema: { type: string, enum: [confirmed, candidate] }
        - in: query
          name: access
          schema: { type: string }
          description: Filter agents that can access a scope (e.g. filesystem, github, secrets)
        - in: query
          name: canAccess
          schema: { type: string }
          description: Alias for access
        - in: query
          name: accessSensitivity
          schema: { type: string, enum: [low, medium, high, critical] }
        - in: query
          name: overPermissioned
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: hasInstructions
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: shadow
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
                  total: { type: integer }
  /api/agents/{id}:
    get:
      tags: [agents]
      summary: Agent detail
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Agent
  /api/assets:
    get:
      tags: [assets]
      summary: List typed assets
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: type
          schema: { type: string }
      responses:
        '200':
          description: Assets
  /api/graph:
    get:
      tags: [graph]
      summary: Topology subgraph
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: depth
          schema: { type: integer, default: 2 }
      responses:
        '200':
          description: Nodes and edges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphPayload' }
  /api/graph/seeds:
    get:
      tags: [graph]
      summary: Suggested graph seed agents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Seed list
  /api/graph/stream:
    get:
      tags: [graph]
      summary: SSE graph / inventory deltas
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: token
          schema: { type: string }
          description: JWT when EventSource cannot set Authorization header
      responses:
        '200':
          description: text/event-stream
  /api/search:
    get:
      tags: [search]
      summary: Faceted search (Postgres MVP; OpenSearch in blueprint)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/q'
      responses:
        '200':
          description: Hits and facets
  /api/discovery/jobs:
    get:
      tags: [discovery]
      summary: List discovery jobs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jobs
    post:
      tags: [discovery]
      summary: Trigger discovery
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collectors:
                  type: array
                  items: { type: string }
      responses:
        '202':
          description: Job accepted
        '409':
          description: Job already running
  /api/discovery/events:
    get:
      tags: [discovery]
      summary: Discovery events
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Events
  /api/discovery/changes:
    get:
      tags: [discovery]
      summary: Discovery change intelligence (new, updated, config drift)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sinceHours
          schema: { type: integer, default: 168 }
        - in: query
          name: hours
          schema: { type: integer }
          description: Alias for sinceHours
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Change summary and lists
  /api/risk/paths:
    get:
      tags: [agents]
      summary: Blast-radius / attack-path scores for agents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Ranked blast-radius items
  /api/dashboards/{name}:
    get:
      tags: [dashboards]
      summary: Dashboard aggregates
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            enum: [executive, operations, discovery, models, frameworks, cloud, ide, timeline]
        - in: query
          name: hideUnknown
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: confirmedOnly
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Dashboard payload
  /api/usage/export:
    get:
      tags: [usage]
      summary: Export usage breakdown CSV
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: dimension
          schema: { type: string, enum: [models, frameworks, cloud, ide, category] }
      responses:
        '200':
          description: CSV body
  /api/usage/providers:
    get:
      tags: [usage]
      summary: Provider token/cost usage signals
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider usage
  /api/usage/evidence:
    get:
      tags: [usage]
      summary: Evidence class / agent status mix
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Evidence mix
  /api/usage/trends:
    get:
      tags: [usage]
      summary: Weekly discovery trends
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Trend series
  /api/export/agents:
    get:
      tags: [export]
      summary: Export agents CSV or JSON
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Export body
  /api/coverage:
    get:
      tags: [coverage]
      summary: Discovery coverage map
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Coverage by source
  /api/audit:
    get:
      tags: [audit]
      summary: Audit events (admin/operator)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit trail
  /api/shadow-ai:
    get:
      tags: [agents]
      summary: Shadow AI findings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Findings
  /api/connectors/schema:
    get:
      tags: [connectors]
      summary: Connector provider field schema
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider schemas
  /api/connectors:
    get:
      tags: [connectors]
      summary: List connectors (secrets masked)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Connector list
    post:
      tags: [connectors]
      summary: Create connector
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
  /api/connectors/{id}:
    get:
      tags: [connectors]
      summary: Get connector
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Connector
    put:
      tags: [connectors]
      summary: Update connector
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Updated
    delete:
      tags: [connectors]
      summary: Delete connector
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
  /api/connectors/{id}/test:
    post:
      tags: [connectors]
      summary: Test connector credentials
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Test result
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    q:
      in: query
      name: q
      schema: { type: string }
    owner:
      in: query
      name: owner
      schema: { type: string }
    model:
      in: query
      name: model
      schema: { type: string }
    framework:
      in: query
      name: framework
      schema: { type: string }
    cloud:
      in: query
      name: cloud
      schema: { type: string }
    category:
      in: query
      name: category
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
        requestId: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [platform_admin, operator, viewer] }
        tenantId: { type: string, format: uuid }
    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string, nullable: true }
        framework: { type: string, nullable: true }
        model: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string }
        cloud_provider: { type: string, nullable: true }
        ide: { type: string, nullable: true }
        confidence_score: { type: number }
        last_seen: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
        agentConfig:
          type: object
          description: Discovered configuration (tools, MCP, instructions, knowledge)
          additionalProperties: true
        agentAccess:
          type: object
          description: Discovered access/permissions map
          additionalProperties: true
        blastRadius:
          type: object
          description: Blast-radius score and paths
          additionalProperties: true
        howIdentified: { type: string, nullable: true }
        evidenceClass: { type: string, nullable: true }
        agentStatus: { type: string, nullable: true }
    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string }
        name: { type: string }
    GraphEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        type: { type: string }
        label: { type: string }
    GraphPayload:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
        meta: { type: object }
