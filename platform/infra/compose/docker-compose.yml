services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentradar
      POSTGRES_PASSWORD: agentradar
      POSTGRES_DB: agentradar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../schemas/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/agentradar
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p agentradar 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../apps/api
    environment:
      PORT: "8080"
      POSTGRES_URL: postgres://agentradar:agentradar@postgres:5432/agentradar
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentradar
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: agentradar-dev-secret-change-me
      BOOTSTRAP_ADMIN_EMAIL: admin@agentradar.local
      BOOTSTRAP_ADMIN_PASSWORD: "AgentRadar!dev"
      RUN_DISCOVERY_IN_API: "true"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  discovery:
    build:
      context: ../../apps/discovery
    environment:
      POSTGRES_URL: postgres://agentradar:agentradar@postgres:5432/agentradar
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentradar
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      API_INTERNAL_URL: http://api:8080
      DISCOVERY_INTERVAL_MS: "300000"
      RUN_ON_START: "true"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
  osdata:
