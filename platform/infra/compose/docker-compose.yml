services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentradar
      POSTGRES_PASSWORD: agentradar
      POSTGRES_DB: agentradar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/agentradar
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p agentradar 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s



  api:
    build:
      context: ../../apps/api
    environment:
      NODE_ENV: development
      PORT: "8080"
      POSTGRES_URL: postgres://agentradar:agentradar@postgres:5432/agentradar
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentradar

      JWT_SECRET: agentradar-dev-secret-change-me
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      BOOTSTRAP_ADMIN_EMAIL: admin@agentradar.local
      BOOTSTRAP_ADMIN_PASSWORD: "AgentRadar!dev"
      DISCOVERY_DEMO_SEED: "false"
      DISCOVERY_AI_ONLY: "true"
      CORS_ORIGIN: http://localhost:5172,http://127.0.0.1:5172
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy


  discovery:
    build:
      context: ../../apps/discovery
    environment:
      NODE_ENV: development
      POSTGRES_URL: postgres://agentradar:agentradar@postgres:5432/agentradar
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentradar

      API_INTERNAL_URL: http://api:8080
      DISCOVERY_INTERVAL_MS: "300000"
      DISCOVERY_DEMO_SEED: "false"
      BOOTSTRAP_ADMIN_EMAIL: admin@agentradar.local
      BOOTSTRAP_ADMIN_PASSWORD: "AgentRadar!dev"
      RUN_ON_START: "true"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  relationship:
    build:
      context: ../../apps/relationship
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentradar
      RELATIONSHIP_DECAY_INTERVAL_MS: "3600000"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    ports:
      - "5172:80"
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
