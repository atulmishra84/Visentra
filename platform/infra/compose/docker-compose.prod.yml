# Production overlay — no published DB ports, env-file secrets, no demo seed
services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  neo4j:
    ports: []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}

  redis:
    ports: []

  nats:
    ports: []

  opensearch:
    ports: []

  api:
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://agentradar:${POSTGRES_PASSWORD}@postgres:5432/agentradar
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@agentradar.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_ON_START: "false"
      ALLOW_DEMO_SEED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  discovery:
    environment:
      NODE_ENV: production
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@agentradar.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      api:
        condition: service_healthy

  web:
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: api:8080
