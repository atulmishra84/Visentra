# docker-compose.ec2.yml
# EC2 overlay — apply AFTER docker-compose.prod.yml
#
# USAGE:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.ec2.yml \
#     up -d --build
#
# PORT MAP after all three files are merged:
#   :8080 → api (Node.js, direct — from base docker-compose.yml)
#   :9000 → web (nginx → React UI + /api/ proxied to api:8080)
#
# WHY port 9000 for web?
#   The base docker-compose.yml publishes api on host:8080.
#   Docker Compose appends port lists across overlay files — it does
#   NOT replace them. If web also used port 8080, both api and web
#   would fight for it. Using port 9000 for web avoids this entirely.

services:
  web:
    # Override the build entirely — use plain nginx + pre-built dist
    # This prevents the container from trying to run 'npm run build' which often fails on EC2 due to memory limits
    image: nginx:1.27-alpine
    ports:
      - "9000:80"
    volumes:
      # Mount the pre-built React app directly (it's already in the repo)
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      # Mount our custom nginx conf
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
