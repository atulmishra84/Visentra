# docker-compose.ec2.yml
# EC2 production overlay — apply AFTER docker-compose.prod.yml
#
# USAGE:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.ec2.yml \
#     up -d --build

services:

  # Keep api internal only — web nginx proxies /api/ to it.
  # Without this, api and web both try to bind host port 8080 → conflict.
  api:
    ports: []

  # Override the web service to:
  #   1. Mount a plain nginx.conf directly (bypasses the unreliable
  #      nginx.conf.template + envsubst mechanism that caused the 404).
  #   2. Expose on port 8080 (same as prod overlay, stated explicitly).
  web:
    ports:
      - "8080:80"
    volumes:
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      API_UPSTREAM: api:8080   # kept for reference, not used by the plain conf
