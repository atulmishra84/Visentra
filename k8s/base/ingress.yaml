apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentradar-ingress
  namespace: agentradar
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
    appgw.ingress.kubernetes.io/waf-policy-for-path: "/subscriptions/SUB_ID/resourceGroups/RG_NAME/providers/Microsoft.Network/applicationGatewayWebApplicationFirewallPolicies/agentradar-waf"
    appgw.ingress.kubernetes.io/request-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - agentradar.idenaccess.com
      secretName: agentradar-tls
  rules:
    - host: agentradar.idenaccess.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentradar-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentradar-frontend
                port:
                  number: 80
