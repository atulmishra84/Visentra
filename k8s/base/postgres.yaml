apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentradar-postgres
  namespace: agentradar
  labels:
    app: agentradar-postgres
spec:
  serviceName: agentradar-postgres
  replicas: 1
  selector:
    matchLabels:
      app: agentradar-postgres
  template:
    metadata:
      labels:
        app: agentradar-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: agentradar
            - name: POSTGRES_USER
              value: agentradar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentradar-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agentradar"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentradar"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-premium
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentradar-postgres
  namespace: agentradar
spec:
  selector:
    app: agentradar-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
