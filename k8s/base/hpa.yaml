apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentradar-api-hpa
  namespace: agentradar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentradar-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentradar-frontend-hpa
  namespace: agentradar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentradar-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
