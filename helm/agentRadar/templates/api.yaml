apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
        azure.workload.identity/use: "true"
    spec:
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-secrets
      containers:
        - name: api
          image: {{ .Values.global.imageRegistry }}/{{ .Values.images.api }}:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: KEYVAULT_URI
              value: {{ .Values.keyvault.vaultUri | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_TLS
              value: {{ .Values.redis.tls | quote }}
            - name: SCAN_RANGES
              value: {{ .Values.scanner.scanRanges | quote }}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: 4000
  type: {{ .Values.service.type }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.autoscaling.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.api.targetCPUUtilizationPercentage }}
{{- end }}
---
# SecretProviderClass — mounts Key Vault secrets via CSI driver (no K8s Secrets needed)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.managedIdentity.clientId | quote }}
    keyvaultName: {{ .Values.keyvault.vaultUri | trimPrefix "https://" | trimSuffix ".vault.azure.net/" | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: {{ .Values.keyvault.secretNames.dbPassword }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secretNames.jwtSecret }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secretNames.encryptionKey }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secretNames.redisPassword }}
          objectType: secret
        - |
          objectName: {{ .Values.keyvault.secretNames.aiApiKey }}
          objectType: secret
    tenantId: {{ .Values.managedIdentity.tenantId | quote }}
