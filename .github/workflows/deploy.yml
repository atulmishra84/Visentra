##############################################################
# AgentRadar — GitHub Actions CI/CD Pipeline
#
# JOBS:
#   1. validate  — lint, syntax check, Helm lint (all PRs + pushes)
#   2. build     — build & push 3 Docker images to ACR (main/release only)
#   3. infra     — terraform plan on PR, terraform apply on main
#   4. deploy    — helm upgrade --install to AKS
#   5. migrate   — run DB migrations inside the API pod
#   6. smoke     — hit /health and verify pods are Running
#
# REQUIRED GITHUB SECRETS (run scripts/setup-github-secrets.sh to set all):
#   AZURE_CLIENT_ID            OIDC service principal client ID
#   AZURE_TENANT_ID            Azure tenant ID
#   AZURE_SUBSCRIPTION_ID      Target subscription
#   AZURE_RESOURCE_GROUP       rg-agentRadar-prod-we
#   AKS_CLUSTER_NAME           aks-agentRadar-prod-we
#   ACR_LOGIN_SERVER           acragentradarprodwe.azurecr.io
#   ACR_NAME                   acragentradarprodwe  (without .azurecr.io)
#   KEYVAULT_URI               https://kv-agentRadar-prod-we.vault.azure.net/
#   POSTGRES_HOST              psql-agentRadar-prod-we.postgres.database.azure.com
#   REDIS_HOST                 redis-agentRadar-prod-we.redis.cache.windows.net
#   TF_STATE_RG                rg-agentRadar-tfstate-we
#   TF_STATE_SA                staragentradartfwe<hex>
#   AI_API_KEY                 sk-ant-... (optional, stored in Key Vault)
#
# REQUIRED GITHUB VARIABLES (not secrets):
#   DOMAIN                     agentRadar.yourcompany.com
#   MANAGED_IDENTITY_CLIENT_ID kubelet identity client ID (from terraform output)
##############################################################

name: AgentRadar CI/CD

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['docs/**', '*.md', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod, staging, dev]
      image_tag:
        description: Docker image tag (blank = git SHA)
        required: false
      skip_build:
        description: Skip image build (reuse existing tag)
        type: boolean
        default: false
      skip_infra:
        description: Skip Terraform (infra already up-to-date)
        type: boolean
        default: false
      run_migrations:
        description: Run DB migrations
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running deploy

env:
  # These come from secrets/vars set by setup-github-secrets.sh
  ACR:          ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_NAME:     ${{ secrets.ACR_NAME }}
  NAMESPACE:    agentRadar
  HELM_CHART:   ./helm/agentRadar
  TF_DIR:       ./terraform/standalone

  # Image names
  IMG_FRONTEND:    agentRadar-frontend
  IMG_API:         agentRadar-api
  IMG_WEBHOOK:     agentRadar-webhook

##############################################################
# JOB 1 — VALIDATE
# Runs on every push and PR. Fast. No Azure access needed.
##############################################################
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── JS syntax check on the platform HTML ──
      - name: Check agentRadarLaunch.html JS
        run: |
          if [[ ! -f agentRadarLaunch.html ]]; then
            echo "⚠ agentRadarLaunch.html not found — skipping JS check"
          else
            node -e "
              const html = require('fs').readFileSync('agentRadarLaunch.html','utf8');
              const m = html.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);
              if (!m) { console.error('No script tag found'); process.exit(1); }
              try { new Function(m[1]); console.log('✓ JS syntax OK'); }
              catch(e) { console.error('✗ JS error:', e.message); process.exit(1); }
            "
          fi

      # ── Dockerfile lint ──
      - name: Lint Dockerfiles
        run: |
          for f in deploy/frontend/Dockerfile deploy/api/Dockerfile deploy/webhook/Dockerfile; do
            if [[ -f "$f" ]]; then
              docker run --rm -i hadolint/hadolint < "$f" && echo "✓ $f" || true
            fi
          done

      # ── Helm lint ──
      - uses: azure/setup-helm@v3
        with: { version: v3.14.0 }

      - name: Helm lint
        run: |
          helm lint ${{ env.HELM_CHART }} \
            --set global.domain=lint.example.com \
            --set global.imageRegistry=lint.azurecr.io \
            --set global.imageTag=lint \
            --set keyvault.vaultUri=https://kv-lint.vault.azure.net/ \
            --set postgres.host=pg-lint.postgres.database.azure.com \
            --set redis.host=redis-lint.redis.cache.windows.net \
            --set managedIdentity.clientId=00000000-0000-0000-0000-000000000000
          echo "✓ Helm lint passed"

      # ── Terraform fmt ──
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.6.x }

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive
        continue-on-error: true   # warn, don't block

      # ── SQL syntax check ──
      - name: Validate SQL migration
        run: |
          python3 -c "
          import re, sys
          with open('migrations/001_schema.sql') as f:
              sql = f.read()
          # Basic check: every BEGIN has a COMMIT
          begins  = len(re.findall(r'\bBEGIN\b',  sql, re.I))
          commits = len(re.findall(r'\bCOMMIT\b', sql, re.I))
          if begins != commits:
              print(f'✗ SQL: {begins} BEGIN / {commits} COMMIT mismatch')
              sys.exit(1)
          print(f'✓ SQL: {begins} transaction block(s) balanced')
          "

##############################################################
# JOB 2 — BUILD & PUSH IMAGES
# Only on main/release pushes and manual dispatch.
# Uses OIDC — no stored Docker/ACR password.
##############################################################
  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request' && inputs.skip_build != true
    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # ── Compute image tag ──
      - name: Compute image tag
        id: tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      # ── OIDC login to Azure ──
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      # ── Frontend image ──
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: deploy/frontend
          file:    deploy/frontend/Dockerfile
          push:    true
          tags: |
            ${{ env.ACR }}/${{ env.IMG_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR }}/${{ env.IMG_FRONTEND }}:latest
          build-args: PLATFORM_HTML=agentRadarLaunch.html
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      # ── API image ──
      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: deploy/api
          file:    deploy/api/Dockerfile
          push:    true
          tags: |
            ${{ env.ACR }}/${{ env.IMG_API }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR }}/${{ env.IMG_API }}:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

      # ── Webhook image ──
      - name: Build & push webhook
        uses: docker/build-push-action@v5
        with:
          context: deploy/webhook
          file:    deploy/webhook/Dockerfile
          push:    true
          tags: |
            ${{ env.ACR }}/${{ env.IMG_WEBHOOK }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR }}/${{ env.IMG_WEBHOOK }}:latest
          cache-from: type=gha,scope=webhook
          cache-to:   type=gha,scope=webhook,mode=max

      - name: Image summary
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          for img in ${{ env.IMG_FRONTEND }} ${{ env.IMG_API }} ${{ env.IMG_WEBHOOK }}; do
            echo "| \`${{ env.ACR }}/${img}\` | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          done

##############################################################
# JOB 3 — TERRAFORM INFRA
# PR:   plan only (posted as summary)
# main: apply
##############################################################
  infra:
    name: Terraform ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.skip_infra != true
    environment: ${{ github.event_name == 'pull_request' && '' || (inputs.environment || 'prod') }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.6.x }

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=agentRadar/${{ inputs.environment || 'prod' }}/terraform.tfstate" \
            -input=false
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC:        "true"

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="anthropic_api_key=${{ secrets.AI_API_KEY }}" \
            -input=false \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC:        "true"

      # Post plan output as PR comment
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC:        "true"

##############################################################
# JOB 4 — HELM DEPLOY
##############################################################
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build, infra]
    # Run if build succeeded (or was skipped) AND infra succeeded
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    environment: ${{ inputs.environment || 'prod' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Resolve image tag: use build output, or manual input, or latest
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ needs.build.outputs.image_tag || inputs.image_tag || 'latest' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying tag: $TAG"

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name           ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing
          kubectl cluster-info

      - uses: azure/setup-helm@v3
        with: { version: v3.14.0 }

      # ── Install NGINX ingress if not present ──
      - name: Ensure NGINX ingress controller
        run: |
          if kubectl get ns ingress-nginx &>/dev/null; then
            echo "NGINX ingress already installed"
            exit 0
          fi
          echo "Installing NGINX ingress controller..."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz \
            --wait --timeout 5m
          echo "NGINX ingress installed"

      # ── Install cert-manager if not present ──
      - name: Ensure cert-manager
        run: |
          if kubectl get ns cert-manager &>/dev/null; then
            echo "cert-manager already installed"
            exit 0
          fi
          echo "Installing cert-manager..."
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set installCRDs=true \
            --wait --timeout 5m
          echo "Creating Let's Encrypt ClusterIssuer..."
          kubectl apply -f - <<EOF
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: admin@${{ vars.DOMAIN }}
              privateKeySecretRef:
                name: letsencrypt-prod
              solvers:
                - http01:
                    ingress:
                      class: nginx
          EOF
          echo "cert-manager installed"

      # ── Helm deploy AgentRadar ──
      - name: Helm upgrade --install
        run: |
          helm upgrade --install agentRadar ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 10m \
            --atomic \
            --cleanup-on-fail \
            --set global.imageRegistry="${{ env.ACR }}" \
            --set global.imageTag="${{ steps.tag.outputs.tag }}" \
            --set global.domain="${{ vars.DOMAIN }}" \
            --set keyvault.vaultUri="${{ secrets.KEYVAULT_URI }}" \
            --set postgres.host="${{ secrets.POSTGRES_HOST }}" \
            --set redis.host="${{ secrets.REDIS_HOST }}" \
            --set ingress.enabled=true \
            --set ingress.host="${{ vars.DOMAIN }}" \
            --set managedIdentity.clientId="${{ vars.MANAGED_IDENTITY_CLIENT_ID }}" \
            --history-max 5

      # ── Rollout status ──
      - name: Verify rollout
        run: |
          for dep in agentRadar-frontend agentRadar-api agentRadar-webhook; do
            echo "Checking $dep..."
            kubectl rollout status deployment/$dep -n ${{ env.NAMESPACE }} --timeout=3m
          done
          echo "✓ All deployments rolled out"

      - name: Deploy summary
        run: |
          INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")

          echo "### Deployment complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://${{ vars.DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ingress IP** | \`${INGRESS_IP}\` |" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "Platform: https://${{ vars.DOMAIN }}"
          [[ "$INGRESS_IP" != "pending" ]] && echo "DNS: ${{ vars.DOMAIN }} → $INGRESS_IP"

##############################################################
# JOB 5 — DB MIGRATIONS
##############################################################
  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      inputs.run_migrations != false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name           ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for API pod
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=agentRadar-api \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      - name: Run migration
        run: |
          API_POD=$(kubectl get pod -n ${{ env.NAMESPACE }} \
            -l app=agentRadar-api \
            -o jsonpath='{.items[0].metadata.name}')

          echo "Running migrations on pod: $API_POD"
          kubectl cp migrations/001_schema.sql \
            ${{ env.NAMESPACE }}/$API_POD:/tmp/schema.sql

          kubectl exec -n ${{ env.NAMESPACE }} $API_POD -- \
            node -e "
              const {Pool} = require('pg');
              const fs     = require('fs');
              const sql    = fs.readFileSync('/tmp/schema.sql','utf8');
              const pool   = new Pool({
                connectionString: process.env.DATABASE_URL ||
                  'postgresql://' + process.env.POSTGRES_USER + ':' +
                  require('fs').readFileSync('/mnt/secrets/db-password','utf8').trim() +
                  '@' + process.env.POSTGRES_HOST + '/' + process.env.POSTGRES_DB +
                  '?sslmode=require'
              });
              pool.query(sql)
                .then(() => { console.log('✓ Migrations applied'); pool.end(); })
                .catch(e  => { console.error('✗ Migration error:', e.message); process.exit(1); });
            "

          echo "✓ Migrations complete" >> $GITHUB_STEP_SUMMARY

##############################################################
# JOB 6 — SMOKE TEST
##############################################################
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: migrate
    if: always() && needs.migrate.result == 'success'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name           ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Check all pods Running
        run: |
          echo "Pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          NOT_RUNNING=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            --field-selector=status.phase!=Running \
            --no-headers 2>/dev/null | grep -v "Completed" | wc -l)

          if [[ "$NOT_RUNNING" -gt 0 ]]; then
            echo "✗ $NOT_RUNNING pod(s) not Running"
            kubectl describe pods -n ${{ env.NAMESPACE }} \
              --field-selector=status.phase!=Running
            exit 1
          fi
          echo "✓ All pods Running"

      - name: Health check via kubectl port-forward
        run: |
          # Port-forward to API and hit /health
          kubectl port-forward -n ${{ env.NAMESPACE }} \
            svc/agentRadar-api 14000:4000 &
          PF_PID=$!
          sleep 3

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:14000/health --max-time 10 || echo "000")

          kill $PF_PID 2>/dev/null || true

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "✓ API /health → HTTP 200"
          else
            echo "✗ API /health → HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Final summary
        run: |
          echo "## ✅ Deploy pipeline complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** https://${{ vars.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "**All smoke tests passed**" >> $GITHUB_STEP_SUMMARY
