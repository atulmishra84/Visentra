version: "3.9"

# ─────────────────────────────────────────────────────────────────
# docker-compose.deploy.yml
#
# Runs the three services from the deploy/ directory:
#   - deploy-api      (Node.js API,   port 4000, internal)
#   - deploy-frontend (Nginx + HTML,  port 8080, public)
#   - deploy-webhook  (Webhook relay, port 4002, internal)
#
# HOW TO USE:
#   Start this alongside the root stack using the -p (project-name) flag
#   so they share the same Docker network:
#
#     # Step 1 — make sure the root stack is already running
#     docker compose -p visentra up -d
#
#     # Step 2 — start the deploy services
#     docker compose -p visentra -f docker-compose.yml -f docker-compose.deploy.yml up -d --build deploy-api deploy-frontend deploy-webhook
#
#   Or standalone (if you want a separate network):
#     docker compose -f docker-compose.deploy.yml up -d --build
# ─────────────────────────────────────────────────────────────────

services:

  # ── Platform API (deploy/api) ──────────────────────────────────
  deploy-api:
    build:
      context: ./deploy/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Frontend (deploy/frontend) ─────────────────────────────────
  deploy-frontend:
    build:
      context: ./deploy/frontend
      dockerfile: Dockerfile
    volumes:
      # Override the K8s-specific nginx config with a Docker-compatible one
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"      # Access via http://<EC2-IP>:8080
    depends_on:
      - deploy-api
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Webhook Relay (deploy/webhook) ────────────────────────────
  deploy-webhook:
    build:
      context: ./deploy/webhook
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4002"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
      REDIS_PASSWORD: ""
    expose:
      - "4002"
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
